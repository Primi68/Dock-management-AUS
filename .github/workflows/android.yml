name: Android MVP
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dock-mvp-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      DOCK_RELEASE_STORE_PASSWORD: ${{ secrets.DOCK_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore fixed release signing key
        env:
          DOCK_RELEASE_KEYSTORE_BASE64: ${{ secrets.DOCK_RELEASE_KEYSTORE_BASE64 }}
        run: bash .github/scripts/prepare-signing.sh
      - name: Android release build and lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify fixed signing identity
        run: bash .github/scripts/verify-signature.sh app/build/outputs/apk/release/app-release.apk
      - name: Name APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Dock-Notes-0.3.4-preview.apk
          cp .github/release-certificate.sha256 dist/SIGNING-CERT-SHA256.txt
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dock-Notes-0.3.4-preview
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/lint-results-release.html
      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "${DOCK_RELEASE_STORE_FILE:-}" ]; then rm -f -- "$DOCK_RELEASE_STORE_FILE"; fi
  android-smoke:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      DOCK_RELEASE_STORE_PASSWORD: ${{ secrets.DOCK_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore fixed release signing key
        env:
          DOCK_RELEASE_KEYSTORE_BASE64: ${{ secrets.DOCK_RELEASE_KEYSTORE_BASE64 }}
        run: bash .github/scripts/prepare-signing.sh
      - uses: actions/download-artifact@v4
        with:
          name: Dock-Notes-0.3.4-preview
          path: dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/verify-signed-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-reports
          path: app/build/reports/androidTests/
      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "${DOCK_RELEASE_STORE_FILE:-}" ]; then rm -f -- "$DOCK_RELEASE_STORE_FILE"; fi
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Dock-Notes-0.3.4-preview
          path: dist
      - name: Publish private preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --title "Dock Notes $GITHUB_REF_NAME — Android MVP" --notes-file docs/releases/0.3.4.md
