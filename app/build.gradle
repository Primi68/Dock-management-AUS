plugins { id 'com.android.application' }

def releaseStoreFile = System.getenv('DOCK_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('DOCK_RELEASE_STORE_PASSWORD')
def requireReleaseSigning = tasks.register('requireReleaseSigning') {
    doLast {
        if (!releaseStoreFile || !releaseStorePassword || !file(releaseStoreFile).isFile()) {
            throw new GradleException('Fixed release signing is required. Set DOCK_RELEASE_STORE_FILE and DOCK_RELEASE_STORE_PASSWORD; debug signing is never a release fallback.')
        }
    }
}

android {
    namespace 'com.primi.docknotes'
    compileSdk 35
    defaultConfig {
        applicationId 'com.primi.docknotes'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.3.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias 'dock-notes'
                keyPassword releaseStorePassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    testBuildType project.findProperty('dockTestBuildType') ?: 'debug'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild' || name == 'validateSigningRelease') dependsOn requireReleaseSigning
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
